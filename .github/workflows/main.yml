name: Import Discord.py Components V2 Handbook ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP filename uploaded to the repository root"
        required: true
        default: "zorvex-discordpy-components-v2.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: import-discordpy-handbook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate and extract ZIP safely
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          if [[ -z "$ZIP_NAME" || "$ZIP_NAME" == */* || "$ZIP_NAME" == *"\\"* || "$ZIP_NAME" != *.zip ]]; then
            echo "Provide only a .zip filename located in the repository root."
            exit 1
          fi

          if [[ ! -f "$ZIP_NAME" ]]; then
            echo "ZIP file not found in repository root: $ZIP_NAME"
            exit 1
          fi

          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT

          python3 - "$ZIP_NAME" "$STAGE" <<'PY'
          import pathlib
          import re
          import stat
          import sys
          import zipfile

          archive_path = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          max_entries = 10_000
          max_uncompressed_bytes = 200 * 1024 * 1024

          try:
              with zipfile.ZipFile(archive_path) as archive:
                  entries = archive.infolist()
                  if not entries:
                      raise ValueError("The ZIP archive is empty.")
                  if len(entries) > max_entries:
                      raise ValueError(f"ZIP contains too many entries (limit: {max_entries}).")

                  total_size = 0
                  seen = set()
                  for entry in entries:
                      name = entry.filename
                      path = pathlib.PurePosixPath(name)
                      mode = (entry.external_attr >> 16) & 0o170000

                      if (
                          not name
                          or path.is_absolute()
                          or ".." in path.parts
                          or "\\" in name
                          or re.match(r"^[A-Za-z]:", name)
                      ):
                          raise ValueError(f"Unsafe archive path: {name!r}")

                      if ".git" in path.parts:
                          raise ValueError(f"The ZIP must not contain Git metadata: {name!r}")
                      if mode == stat.S_IFLNK:
                          raise ValueError(f"Symbolic links are not accepted: {name!r}")
                      if name in seen:
                          raise ValueError(f"Duplicate archive entry: {name!r}")
                      seen.add(name)

                      total_size += entry.file_size
                      if total_size > max_uncompressed_bytes:
                          raise ValueError("Uncompressed ZIP size exceeds the 200 MiB safety limit.")

                  archive.extractall(destination)
          except (zipfile.BadZipFile, OSError, RuntimeError, ValueError) as exc:
              raise SystemExit(f"ZIP validation/extraction failed: {exc}") from exc
          PY

          mapfile -t TOP_LEVEL < <(find "$STAGE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          SOURCE="$STAGE"

          
          if (( ${#TOP_LEVEL[@]} == 1 )) && [[ -d "$STAGE/${TOP_LEVEL[0]}" ]]; then
            SOURCE="$STAGE/${TOP_LEVEL[0]}"
          fi

          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/.next/' \
            --exclude='/.venv/' \
            --exclude='/venv/' \
            --exclude='/__pycache__/' \
            --exclude='*.pyc' \
            --exclude='/.env' \
            "$SOURCE/" ./

          # Delete the ZIP only after validation and extraction have succeeded.
          rm -- "$ZIP_NAME"

      - name: Commit extracted files and ZIP removal
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: import Discord.py Components V2 handbook"
          git push origin "HEAD:${GITHUB_REF_NAME}"
